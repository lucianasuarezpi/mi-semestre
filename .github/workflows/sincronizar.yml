name: Sincronizar y publicar

on:
  schedule:
    # Cada hora, al minuto 17. GitHub retrasa mucho los cron que caen en punto,
    # porque es cuando todo el mundo los programa.
    - cron: "17 * * * *"
  workflow_dispatch:        # botón para dispararlo a mano desde la pestaña Actions
  push:
    branches: [main]

# Si una corrida se demora, que la siguiente no se le encime.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read            # solo leer el repo; nada que escribir
  pages: write              # publicar el sitio
  id-token: write           # lo exige deploy-pages

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # trae fetch nativo; el script no usa dependencias

      - name: Probar las piezas delicadas
        run: node scripts/probar.mjs

      - name: Consultar Notion y Bloque Neón
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          CLASES_ICS_URL: ${{ secrets.CLASES_ICS_URL }}
          BLOQUENEON_ICS_URL: ${{ secrets.BLOQUENEON_ICS_URL }}
        run: node scripts/sincronizar.mjs

      # datos/agenda.json queda escrito en el directorio de trabajo y se sube
      # dentro del artefacto. No le hacemos commit: el que está en el repo es
      # solo un marcador para poder trabajar en local.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: desplegar
